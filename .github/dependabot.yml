version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      development-dependencies:
        dependency-type: development
    # eslint 10 và typescript 7 làm hỏng `pnpm lint` qua transitive deps của
    # eslint-config-next@16.3.0 (xem commit ce42e23). Chỉ chặn major — minor và
    # patch vẫn được đề xuất để không bỏ sót bản vá bảo mật. Bỏ 2 entry này khi
    # eslint-config-next hỗ trợ ESLint 10 / TS 7.
    ignore:
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
